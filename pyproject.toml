[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "functdesepc"
version = "0.1.0"
authors = [
    { name="Emmanuel Flórez" }
]
description = "Package for EPC functional design utilities."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "utm",
    "pyproj",
    "matplotlib",
    "openpyxl",
    "Pillow",
    "scipy",
    "python-docx",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
]

[tool.setuptools.packages.find]
where = ["src"]
